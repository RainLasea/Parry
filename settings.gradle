pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
    }
}
rootProject.name = 'Art of Parrying'

// Keep short task paths while grouping physical modules by loader and Minecraft version.
[
    'forge-1.20.1': 'platforms/forge/1.20.1',
    'fabric-1.20.1': 'platforms/fabric/1.20.1',
    'fabric-1.21.1': 'platforms/fabric/1.21.1',
    'neoforge-1.21.1': 'platforms/neoforge/1.21.1'
].each { name, directory ->
    include name
    project(":${name}").projectDir = file(directory)
}
