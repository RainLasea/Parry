plugins {
    id 'base'
    alias(libs.plugins.neoforge) apply false
    alias(libs.plugins.forge) apply false
    alias(libs.plugins.fabric.loom) apply false
}

group = providers.gradleProperty('mod_group').get()
version = providers.gradleProperty('mod_version').get()
defaultTasks 'build'

def targets = subprojects.collect { it.name }

subprojects {
    group = rootProject.group
    version = "${rootProject.version}-${name}"
    layout.buildDirectory = rootProject.layout.buildDirectory.dir("platforms/${name}")
}

['assemble', 'check', 'build'].each { lifecycle ->
    tasks.named(lifecycle) {
        dependsOn targets.collect { ":${it}:${lifecycle}" }
    }
}

tasks.register('buildAll') {
    group = 'build'
    description = 'Build and test every supported Minecraft/loader target.'
    dependsOn tasks.named('build')
}

tasks.register('collectJars', Sync) {
    group = 'build'
    description = 'Build all targets and collect installable JARs in build/releases.'
    dependsOn tasks.named('build')
    into layout.buildDirectory.dir('releases')
    targets.each { target ->
        from(layout.buildDirectory.file("platforms/${target}/libs/${mod_id}-${version}-${target}.jar"))
    }
}

tasks.register('test') {
    group = 'verification'
    description = 'Run tests for all supported targets.'
    dependsOn targets.collect { ":${it}:test" }
}

// Preserve the former root commands for the default NeoForge development target.
['runClient', 'runServer'].each { run ->
    tasks.register(run) {
        group = 'application'
        description = "Run the NeoForge 1.21.1 ${run == 'runClient' ? 'client' : 'server'}."
        dependsOn ":neoforge-1.21.1:${run}"
    }
}
