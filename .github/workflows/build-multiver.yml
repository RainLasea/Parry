name: Multi-loader 1.21.1 and 1.20.1

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Upload all four jars to CurseForge after a successful build
        type: boolean
        default: false
      release_type:
        description: CurseForge release type (manual publishing only)
        type: choice
        default: release
        options:
          - release
          - beta
          - alpha
      changelog:
        description: Optional notes to include above the Git commit log
        type: string
        default: ''

permissions:
  contents: read

env:
  CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      release_type: ${{ steps.release.outputs.release_type }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version and validate release tag
        id: release
        shell: python
        env:
          MANUAL_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          import os
          import re
          from pathlib import Path

          properties = Path('gradle.properties').read_text(encoding='utf-8')
          match = re.search(r'^mod_version\s*=\s*([0-9][0-9A-Za-z.+_-]*)\s*$', properties, re.MULTILINE)
          if not match:
              raise SystemExit('Cannot read mod_version from gradle.properties')
          version = match.group(1)
          ref = os.environ['GITHUB_REF']
          if ref.startswith('refs/tags/'):
              tag = ref.removeprefix('refs/tags/')
              if tag not in (version, f'v{version}'):
                  raise SystemExit(f'Release tag must be {version} or v{version}, matching gradle.properties')
          release_type = 'release'
          if 'alpha' in version.lower():
              release_type = 'alpha'
          elif 'beta' in version.lower() or re.search(r'(?:^|[.+_-])rc', version.lower()):
              release_type = 'beta'
          if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              release_type = os.environ['MANUAL_RELEASE_TYPE']
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\nrelease_type={release_type}\n')
      - name: Check CurseForge configuration
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          if [[ -z "$CURSEFORGE_TOKEN" ]]; then
            echo '::error::Add the CURSEFORGE_TOKEN repository secret before publishing.'
            exit 1
          fi
          if [[ ! "$CURSEFORGE_PROJECT_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo '::error::Set the CURSEFORGE_PROJECT_ID repository variable to your numeric project ID.'
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon collectJars
      - name: Verify all four release jars
        shell: python
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          import os
          from pathlib import Path

          version = os.environ['RELEASE_VERSION']
          for target in ('fabric-1.20.1', 'forge-1.20.1', 'fabric-1.21.1', 'neoforge-1.21.1'):
              jar = Path(f'build/releases/artofparrying-{version}-{target}.jar')
              if not jar.is_file():
                  raise SystemExit(f'Missing release jar: {jar}')
      - name: Generate release notes from Git commits
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          MANUAL_CHANGELOG: ${{ inputs.changelog }}
        run: python .github/scripts/generate_changelog.py --output build/releases/CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: art-of-parrying-multiloader
          path: |
            build/releases/*.jar
            build/releases/CHANGELOG.md
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.loader }} ${{ matrix.minecraft }}
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            minecraft: '1.20.1'
            java: '17'
            dependencies: fabric-api(required)
          - loader: forge
            minecraft: '1.20.1'
            java: '17'
            dependencies: ''
          - loader: fabric
            minecraft: '1.21.1'
            java: '21'
            dependencies: fabric-api(required)
          - loader: neoforge
            minecraft: '1.21.1'
            java: '21'
            dependencies: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: art-of-parrying-multiloader
          path: build/releases
      - name: Upload to CurseForge
        # mc-publish v3.3; pin the action that receives the publishing token.
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: ${{ env.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/releases/artofparrying-${{ needs.build.outputs.version }}-${{ matrix.loader }}-${{ matrix.minecraft }}.jar
          name: Art of Parrying ${{ needs.build.outputs.version }} - ${{ matrix.loader }} ${{ matrix.minecraft }}
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.release_type }}
          changelog-file: build/releases/CHANGELOG.md
          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft }}
          java: ${{ matrix.java }}
          environment: client | server
          curseforge-dependencies: ${{ matrix.dependencies }}
          fail-mode: fail
