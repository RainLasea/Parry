// Version-specific dependency providers are declared by the two Fabric targets.
apply from: rootProject.file('gradle/mod-common.gradle')

loom { mods { artofparrying { sourceSet sourceSets.main } } }

repositories {
    maven {
        url = 'https://maven.shedaniel.me/'
        content { includeGroup 'me.shedaniel.cloth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    mappings loom.officialMojangMappings()
    modImplementation libs.fabric.loader
    modImplementation fabricApiDependency

    implementation libs.nightconfig.toml
    include libs.nightconfig.toml
    include libs.nightconfig.core

    modCompileOnly playerAnimatorDependency
    modCompileOnly punchyDependency
    modCompileOnly cameraOverhaulDependency
    modCompileOnly clothConfigDependency
    modCompileOnly modMenuDependency
    if (providers.gradleProperty('withPlayerAnimator').getOrElse('false').toBoolean()) {
        modRuntimeOnly playerAnimatorDependency
    }
    if (providers.gradleProperty('withPunchy').getOrElse('false').toBoolean()) {
        modRuntimeOnly punchyDependency
    }
    if (providers.gradleProperty('withCameraOverhaul').getOrElse('false').toBoolean()) {
        modRuntimeOnly cameraOverhaulDependency
    }
    if (providers.gradleProperty('withClothConfig').getOrElse('false').toBoolean()
            || providers.gradleProperty('withCameraOverhaul').getOrElse('false').toBoolean()) {
        modRuntimeOnly clothConfigDependency
        modRuntimeOnly libs.cloth.basic.math
    }
    if (providers.gradleProperty('withModMenu').getOrElse('false').toBoolean()) {
        modRuntimeOnly modMenuDependency
    }
}
