cloth-neoforge-mc1211 = { module = "maven.modrinth:cloth-config", version = "15.0.140+neoforge" }
cloth-basic-math = { module = "me.shedaniel.cloth:basic-math", version = "0.6.1" }
modmenu-mc1201 = { module = "maven.modrinth:modmenu", version = "7.2.2" }
