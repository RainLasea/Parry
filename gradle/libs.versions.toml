playeranimator-neoforge-mc1211 = { module = "maven.modrinth:playeranimator", version = "2.0.4+1.21.1-forge" }
punchy-forge-mc1201 = { module = "maven.modrinth:punchy-fpa", version = "YUkGOyu4" }
punchy-fabric-mc1201 = { module = "maven.modrinth:punchy-fpa", version = "svMK7vMp" }
punchy-fabric-mc1211 = { module = "maven.modrinth:punchy-fpa", version = "vQFe6AaG" }
punchy-neoforge-mc1211 = { module = "maven.modrinth:punchy-fpa", version = "luK5HVTT" }
cameraoverhaul-forge-mc1201 = { module = "maven.modrinth:cameraoverhaul", version = "Apl3bbtA" }
cameraoverhaul-fabric-mc1201 = { module = "maven.modrinth:cameraoverhaul", version = "ULeTXsvh" }
cameraoverhaul-fabric-mc1211 = { module = "maven.modrinth:cameraoverhaul", version = "B9tByLOZ" }
